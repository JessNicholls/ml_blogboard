spec_version: v1
name: tutorial_agent
description: >-
  Selects a domain and topic, then generates a comprehensive tutorial-style
  blog post in Markdown. Returns the updated BlogState including the generated
  content, domain, topic, subtopics, and estimated read time.
permission: read_only
input_schema:
  type: object
  required:
    - state
  properties:
    state:
      type: object
      title: BlogState
      required: []
      properties:
        domain:
          type: string
          title: Domain
        topic:
          type: string
          title: Topic
        subtopics:
          type: string
          title: Subtopics
        date:
          type: string
          title: Date
        dry_run:
          type: boolean
          title: Dry Run
        news_data:
          type: string
          title: News Data
        content:
          type: string
          title: Content
        read_time:
          type: string
          title: Read Time
        validator_feedback:
          type: string
          title: Validator Feedback
        revision_count:
          type: integer
          title: Revision Count
        revision_needed:
          type: boolean
          title: Revision Needed
        md_path:
          type: string
          title: Md Path
        skipped:
          type: boolean
          title: Skipped
output_schema:
  type: object
  title: BlogState
  required: []
  properties:
    domain:
      type: string
      title: Domain
    topic:
      type: string
      title: Topic
    subtopics:
      type: string
      title: Subtopics
    date:
      type: string
      title: Date
    dry_run:
      type: boolean
      title: Dry Run
    content:
      type: string
      title: Content
    read_time:
      type: string
      title: Read Time
    validator_feedback:
      type: string
      title: Validator Feedback
    revision_count:
      type: integer
      title: Revision Count
    revision_needed:
      type: boolean
      title: Revision Needed
    md_path:
      type: string
      title: Md Path
    skipped:
      type: boolean
      title: Skipped
binding:
  python:
    function: blogboard.agents.tutorial_agent.agent:tutorial_node
    requirements: []
is_async: false
response_format: content
