spec_version: v1
name: news_agent
description: >-
  Researches live AI news using web-search tools, then synthesises the findings
  into a technology news roundup blog post in Markdown. Returns the updated
  BlogState including the generated content, news research summary, and
  estimated read time.
permission: read_only
input_schema:
  type: object
  required:
    - state
  properties:
    state:
      type: object
      title: BlogState
      required: []
      properties:
        domain:
          type: string
          title: Domain
        topic:
          type: string
          title: Topic
        date:
          type: string
          title: Date
        dry_run:
          type: boolean
          title: Dry Run
        news_data:
          type: string
          title: News Data
        content:
          type: string
          title: Content
        read_time:
          type: string
          title: Read Time
        validator_feedback:
          type: string
          title: Validator Feedback
        revision_count:
          type: integer
          title: Revision Count
        revision_needed:
          type: boolean
          title: Revision Needed
        md_path:
          type: string
          title: Md Path
        skipped:
          type: boolean
          title: Skipped
output_schema:
  type: object
  title: BlogState
  required: []
  properties:
    domain:
      type: string
      title: Domain
    topic:
      type: string
      title: Topic
    date:
      type: string
      title: Date
    dry_run:
      type: boolean
      title: Dry Run
    news_data:
      type: string
      title: News Data
    content:
      type: string
      title: Content
    read_time:
      type: string
      title: Read Time
    validator_feedback:
      type: string
      title: Validator Feedback
    revision_count:
      type: integer
      title: Revision Count
    revision_needed:
      type: boolean
      title: Revision Needed
    md_path:
      type: string
      title: Md Path
    skipped:
      type: boolean
      title: Skipped
binding:
  python:
    function: blogboard.agents.news_agent.agent:news_node
    requirements: []
is_async: false
response_format: content
